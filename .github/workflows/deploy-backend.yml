name: Deploy Laravel Backend to Hostinger VPS

on:
  push:
    branches:
      - jonathan
    paths:
      - 'clarify-api/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Hostinger VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /var/www/clarify/ClariFy/clarify-api

            # Put Laravel into maintenance mode
            php artisan down || true

            # Pull latest changes
            git pull origin jonathan

            # Install production dependencies
            composer install --no-dev --optimize-autoloader --no-interaction

            # Run database migrations
            php artisan migrate --force

            # Optimize caches
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Restore correct web server ownership and permissions
            chown -R www-data:www-data storage bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            # Restart queue workers
            php artisan queue:restart

            # Reload PHP-FPM (adjust to your installed version, e.g., php8.3-fpm or php8.2-fpm)
            sudo systemctl reload php8.3-fpm || sudo systemctl restart php*-fpm

            # Bring Laravel back online
            php artisan up
